<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>피드 확인기 — tidepic</title>
<meta name="description" content="tidepic 피드가 규칙에 맞는지, 어떤 값으로 그려지는지 확인합니다.">
<link rel="alternate" hreflang="en" href="https://tidepic.com/check.html">
<link rel="alternate" hreflang="ko" href="https://tidepic.com/check.ko.html">
<link rel="stylesheet" href="check.css">
</head>
<body>
<main>
  <a class="home" href="ko.html">← tidepic</a>
  <h1>피드 확인기</h1>
  <p>피드 JSON 을 붙여 넣으면 규칙에 맞는지, 그리고 컴패니언이 어떤 값으로 장면을 그리게 되는지 보여 줍니다.</p>
  <p>붙여 넣은 내용은 이 브라우저 안에서만 계산합니다. 어디에도 보내지 않습니다.</p>
  <div class="examples">
    <span>예시:</span>
    <button type="button" data-example="steps">걸음수</button>
    <button type="button" data-example="price">시세</button>
    <button type="button" data-example="score">경기 점수</button>
    <button type="button" data-example="days">남은 날</button>
  </div>
  <label for="feed">피드 (JSON)</label>
  <textarea id="feed" spellcheck="false" autocomplete="off"></textarea>
  <div id="result" aria-live="polite"></div>
  <footer>
    계산 방법은 <a href="https://github.com/tidepark/tidepic/blob/main/SPEC.ko.md">규칙</a> 3절에 있습니다. 이 페이지가 쓰는 검사와 계산 코드는 <a href="https://github.com/tidepark/tidepic/tree/main/runtime">저장소의 runtime 폴더</a>에 있습니다. 초안 0.1 입니다.
    <br><a href="check.html" lang="en">English</a>
  </footer>
</main>
<script type="module" src="check.js"></script>
</body>
</html>
